name: Apply report enhancements

on:
  push:
    branches:
      - codex/safe-data-guards
    paths:
      - .github/workflows/apply-report-enhancements.yml
      - tools/apply-report-enhancements.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply report enhancements
        run: node tools/apply-report-enhancements.mjs index.html

      - name: Remove temporary transformer
        run: |
          rm -f tools/apply-report-enhancements.mjs
          rm -f .github/workflows/apply-report-enhancements.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add index.html tools/apply-report-enhancements.mjs .github/workflows/apply-report-enhancements.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Enhance reports dashboard"
            git push
          fi
